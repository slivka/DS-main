name: E2E

on:
  workflow_dispatch:
    inputs:
      browsers:
        description: "Prohlížeče"
        type: choice
        options: [chromium, all]
        default: chromium
  schedule:
    # 03:15 Europe/Prague: 01:15 UTC v letním, 02:15 UTC v zimním čase; druhý běh skončí hned.
    - cron: "15 1 * * *"
    - cron: "15 2 * * *"
  push:
    branches: [main]
    paths: [package.json]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Noční běh jen po novém commitu
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Prague date +%H)" != "03" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Mimo 03:xx Europe/Prague (posun letního času)."
          elif [ "${{ github.event_name }}" = "schedule" ] \
            && [ -z "$(git log -1 --since='24 hours ago' --format=%H origin/main)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Za posledních 24 h na main nepřibyl commit."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Volba prohlížečů
        if: steps.gate.outputs.run == 'true'
        id: browsers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.browsers }}" = "all" ]; then
            echo "install=chromium firefox webkit" >> "$GITHUB_OUTPUT"
            echo "projects=--project=chromium --project=firefox --project=webkit" >> "$GITHUB_OUTPUT"
          else
            echo "install=chromium" >> "$GITHUB_OUTPUT"
            echo "projects=--project=chromium" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version-file: .bun-version

      - name: Instalace závislostí
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Cache prohlížečů Playwright
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ steps.browsers.outputs.install }}

      - name: Instalace prohlížečů
        if: steps.gate.outputs.run == 'true'
        run: bunx playwright install --with-deps ${{ steps.browsers.outputs.install }}

      # Jen pro excel-download.spec.ts: vzorový export musí otevřít LibreOffice bez varování.
      - name: LibreOffice Calc
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Úplná kontrola
        if: steps.gate.outputs.run == 'true'
        run: bun run check:full

      - name: E2E
        if: steps.gate.outputs.run == 'true'
        run: bun run test:e2e ${{ steps.browsers.outputs.projects }}

      - name: Report a trace
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
